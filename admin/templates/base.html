<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VAG API Admin{% block title_suffix %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .sidebar { min-height: 100vh; background: #1a2744; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); border-radius: 6px; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.2rem; }
    .badge-active { background: #198754; }
    .badge-inactive { background: #dc3545; }
    code { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-none d-md-flex flex-column sidebar py-3 px-3 gap-1">
      <span class="brand mb-3">VAG API Admin</span>
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Главная</a>
      <a href="/apikeys" class="nav-link {% if request.path.startswith('/apikeys') %}active{% endif %}">API ключи</a>
      <hr class="border-secondary">
      <a href="{{ api_url }}/docs" target="_blank" class="nav-link">Swagger UI ↗</a>
    </nav>

    <main class="col-md-10 py-4 px-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
